<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabScore — Pagina non trovata</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 28px;
        text-align: center;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 18px;
        font-weight: 700;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.5;
        color: #475569;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: #1d4ed8;
        color: #ffffff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
      }
      a:hover {
        background: #1e40af;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Pagina non trovata</h1>
      <p>
        L’indirizzo richiesto non è disponibile. Puoi tornare subito al registro
        locale di TabScore.
      </p>
      <a href="./">Apri TabScore</a>
    </main>
  </body>
</html>
